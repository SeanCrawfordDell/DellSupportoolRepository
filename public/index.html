<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISG Tool Tracker - React CDN Test</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .container {
        background: white;
        color: #333;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }
      h1 {
        color: #0076CE;
        margin-bottom: 20px;
      }
      .status {
        padding: 15px;
        margin: 10px 0;
        border-radius: 5px;
        background: #e8f5e9;
        border-left: 4px solid #4caf50;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [count, setCount] = useState(0);

        return (
          <div className="container">
            <h1>ISG Tool Tracker - React CDN Test</h1>
            <div className="status">
              <strong>✅ React via CDN</strong><br>
              This React application is loaded via CDN instead of Vite build.
            </div>
            <div className="status">
              <strong>🧪 Interactive Test</strong><br>
              Button clicks: {count}
            </div>
            <button onClick={() => setCount(count + 1)} style={{
              padding: '10px 20px',
              fontSize: '16px',
              cursor: 'pointer',
              background: '#0076CE',
              color: 'white',
              border: 'none',
              borderRadius: '5px'
            }}>
              Click me
            </button>
            <p><strong>Current time:</strong> {new Date().toLocaleString()}</p>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
